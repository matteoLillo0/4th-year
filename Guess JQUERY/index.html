<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Number</title>
    <!-- cdn bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">  
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- CDN JQUERY-->
    <link rel="stylesheet" href="style.css"> <!-- mio stile -->
</head>
<body class="d-flex flex-column min-vh-100"> <!-- per far occupare tutto lo spazio -->
    <div class="container mt-5 flex-grow-1"> <!-- container per il content -->
        <h1 class="text-center">Guess the number</h1> 
        <p class="text-center">Scommetti e vinci indovinando un numero casuale tra 2 e 12!</p>
        <!-- Form per la scommessa -->
        <div class="row justify-content-center"> <!-- row -->
            <div class="col-4 justify-content-center"> <!-- col divise in 3 per per avere lo spazio in mezzo -->
                <form id="gameForm">
                    <div class="form-group"> <!-- form per il numero -->
                        <label for="numero">Scegli un numero (2-12):</label>
                        <input type="number" class="form-control" id="number" min="2" max="12" required>
                    </div>
                    <div class="form-group"> <!-- form per la puntata -->
                        <label for="puntata">Puntata:</label>
                        <input type="number" class="form-control" id="scommessaSoldi" min="1" required>
                    </div>
                    <button type="button" id="lanciaDadiBtn" class="btn btn-primary btn-block mt-2">Lancia i dadi!</button> <!-- bottone per giocare , non ha onclick ma usa l'id-->
                </form>
                <div id="balance" class="mt-3">Saldo attuale: 100€</div> <!-- per mostrare il saldo -->
                <div id="risultato" class="mt-4 text-center"></div> <!-- div per il risultato -->
                <div id="btnPrestitoContainer" class="text-center mt-4" style="display: none;"> <!-- btn per il prestito, viene mostrato solo quando serve-->
                    <button class="btn btn-warning" onclick="resetGame()">Sei al verde, vuoi un prestito per ricominciare?</button> <!-- bottone per resettare -->
                </div>
            </div>            
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3 mt-auto">
        <p>&copy; Matteo Angiolillo 4°H 2025-03-07</p>
    </footer>
    <!-- mio script -->
    <script src="script.js"></script>
    <!-- js bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
